[package]
name = "devtools-inspector"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:rfd"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.12.5", optional = true, features = ["custom-protocol"] }
rfd = { version = "=0.17.2", optional = true }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading", "Win32_System_Pipes"] }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[[bin]]
name = "devtools-inspector"
path = "src/main.rs"
required-features = ["desktop"]
