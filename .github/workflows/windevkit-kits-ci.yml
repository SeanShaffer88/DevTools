# Active root-level gate for the WinDevKit collection. The nested source
# workflow is retained as a reference after the repository merge.
name: WinDevKit kits CI
on:
  push:
    branches: [main]
    paths:
      - 'windevkit/kits/**'
      - 'windevkit/crates/**'
      - '.github/workflows/windevkit-kits-ci.yml'
  pull_request:
    paths:
      - 'windevkit/kits/**'
      - 'windevkit/crates/**'
      - '.github/workflows/windevkit-kits-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    name: ${{ matrix.kit }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        kit:
          - ArchiveKit
          - BridgeKit
          - ClipKit
          - CrashKit
          - DiagKit
          - EmbedKit
          - FastSearch
          - FileMetaKit
          - FileOpsKit
          - FixtureKit
          - HardwareInfo
          - ImageKit
          - InstanceKit
          - JobKit
          - LinkKit
          - LogKit
          - MediaKit
          - NetKit
          - NotifyKit
          - OCRKit
          - PDFKit
          - PathKit
          - ProcessKit
          - ProviderKit
          - RegKit
          - RenameKit
          - SettingsKit
          - ShellInteropKit
          - ShellKit
          - SignKit
          - ThumbKit
          - TimeKit
          - UiProbeKit
          - UpdateKit
          - VaultKit
          - WatchKit
        include:
          - kit: ArchiveKit
            post: python tests/native_interop.py target/release/archive_kit.dll
          - kit: EmbedKit
            fetch: true
            e2e: "$env:EK_E2E='1'; $env:EK_ORT_LIB='fixtures/ort/lib/onnxruntime.dll'; $env:EK_MODEL='fixtures/model.onnx'; $env:EK_VOCAB='fixtures/vocab.txt'; cargo test --locked --test e2e -- --ignored --nocapture"
          - kit: ImageKit
            post: python tests/native_interop.py target/release/imagekit.dll
          - kit: OCRKit
            fetch: true
            e2e: "$env:OK_E2E='1'; $env:OK_TESSDATA='vendor/tessdata'; cargo test --locked --test e2e -- --ignored --nocapture"
          - kit: UpdateKit
            e2e: "$env:UK_E2E='1'; cargo test --locked --test e2e -- --ignored --nocapture"
    defaults:
      run:
        working-directory: windevkit/kits/${{ matrix.kit }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fetch pinned engine files (SHA-256 verified)
        if: matrix.fetch
        run: ./fetch.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: E2E proof (env-gated, per-kit)
        if: matrix.e2e
        run: ${{ matrix.e2e }}
      - run: cargo build --release --locked
      - name: Native independent interop
        if: matrix.post
        run: ${{ matrix.post }}

  win-common:
    name: win-common
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windevkit/crates/win-common
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
